# project-dam builds (see Dockerfile.build). No ROM is needed to build: the
# ROM asset symbols are pre-generated (port/src/romassets_<region>.s) and the
# game reads the user's ROM at run time.
#
#   docker compose pull                  # once (the published, digest-pinned image)
#   docker compose run --rm linux        # Linux reference build -> build-linux/
#   docker compose run --rm switch       # Switch build -> build-switch/
#   docker compose run --rm windows      # Windows cross-build -> build-win/
#                                        # (own image: Dockerfile.windows)
#   docker compose run --rm shell        # interactive shell in the toolchain
#
# All services share the project-dam-ccache volume (fixed name, so every
# worktree uses the same cache). A plain `docker run` gets it with
# `-v project-dam-ccache:/ccache`.
# One project name for every checkout and worktree: otherwise each folder gets
# its own <folder>_default network and Docker runs out of address pools.
name: project-dam

# The build image: Dockerfile.build, published by .github/workflows/build-image.yml
# and pinned by digest. tools/check_build_image.py keeps this, ci.yml, dev.py and
# fxview.py on the same reference (`--set <ref>` after a new publish).
x-build-image: &build_image ghcr.io/christphe/project-dam-build@sha256:7ba869fa0ea8b7195b7dcab3b23f87ae2e3065fac1001bd89ca817771dcc7baf

services:
  linux:
    image: *build_image
    pull_policy: missing
    working_dir: /src
    volumes:
      - .:/src
      - ccache:/ccache
    command:
      - sh
      - -c
      - cmake -S . -B build-linux -G Ninja -DROMID=ntsc-final && cmake --build build-linux
  switch:
    image: *build_image
    pull_policy: missing
    working_dir: /src
    volumes:
      - .:/src
      - ccache:/ccache
    command:
      - sh
      - -c
      - >-
        cmake -S . -B build-switch -G Ninja -DROMID=ntsc-final
        -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake
        && cmake --build build-switch
  # Windows x86_64 cross-compilation (MinGW-w64 on Fedora, Dockerfile.windows)
  # -> build-win/ge007.x86_64.exe + runtime DLLs. Other regions:
  # `docker compose run --rm -e ROMID=pal-final windows`.
  windows:
    build:
      context: .
      dockerfile: Dockerfile.windows
    image: local/project-dam-build-windows:latest
    network_mode: none   # offline build; also avoids allocating a network
    working_dir: /src
    volumes:
      - .:/src
    command: ["sh", "tools_pc/docker-build-win.sh"]
  # Linux arm64 handhelds (PortMaster, e.g. muOS) (Dockerfile.arm64, Ubuntu 20.04, glibc 2.31)
  # -> build-arm64/ge007.aarch64.
  arm64:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    image: local/project-dam-build-arm64:latest
    working_dir: /src
    volumes:
      - .:/src
      - ccache:/ccache
    command:
      - sh
      - -c
      - >-
        cmake -S . -B build-arm64 -G Ninja -DROMID=ntsc-final
        -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-arm64.cmake -DGE_ARM64=ON
        -DGE_VULKAN=OFF -DGE007_BUILD_TESTS=OFF
        && cmake --build build-arm64
  # Only to test a Dockerfile.build change before publishing it:
  # `docker compose build image-local`, then DOCKER_IMAGE=local/project-dam-build:latest
  # (tools/dev.py, .env) or `docker run` it directly.
  image-local:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: local/project-dam-build:latest
    profiles: ["local"]
  shell:
    image: *build_image
    pull_policy: missing
    working_dir: /src
    volumes:
      - .:/src
      - ccache:/ccache
    entrypoint: ["bash"]

volumes:
  ccache:
    name: project-dam-ccache
