name: Build image

# Builds Dockerfile.build (devkitA64 + libnx + portlibs + the patched uam) and
# publishes it to ghcr.io/christphe/project-dam-build. ci.yml, compose.yaml and
# the dev scripts pin the result by digest: copy the reference from the run
# summary and apply it with `python tools/check_build_image.py --set <ref>`.

on:
  push:
    paths:
      - Dockerfile.build
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: |
            ghcr.io/christphe/project-dam-build:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/christphe/project-dam-build:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "ghcr.io/christphe/project-dam-build@${DIGEST}"
            echo '```'
            echo
            echo "Pin it with:"
            echo
            echo '```'
            echo "python tools/check_build_image.py --set ghcr.io/christphe/project-dam-build@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
