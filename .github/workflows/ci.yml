name: CI

# Project Dam: builds the Nintendo Switch NRO and the Windows zip on every push
# and pull request, runs the unit tests and the generated-file checks, and
# publishes a GitHub release for a project-dam-vX.Y.Z tag, with the notes taken
# from that version's section of CHANGELOG.md.
#
# This file replaced upstream's ci.yml (and selfhosted.yml was removed): GitHub
# keeps a workflow's enabled/disabled state by path, and upstream's ci.yml had
# been disabled on this fork, so after this file first lands on main run
# `gh workflow enable CI --repo christphe/project-dam-nx`.

on:
  push:
    branches: [ main ]
    tags: [ 'project-dam-v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Did this change touch anything outside docs / licenses? A docs-only push or
  # pull request skips the build jobs, which then report "skipped" (branch
  # protection takes that as success; a job that never ran would stay
  # "expected"). A PR is diffed against its base, a branch push against
  # github.event.before; tags and manual runs always build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          elif [ "${{ github.event_name }}" != "push" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "no usable base ${base} / head ${head}: building to be safe"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change: skipping the builds"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Generated sources and indexes are committed: each generator's --check fails
  # when its output is stale (e.g. menu.json edited without regenerating
  # menu_data.cpp). Python only, no build.
  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Byte-compile the Python tooling
        run: python3 -m compileall -q scripts tools tools_pc

      - name: Generated files are current
        run: |
          python3 tools_pc/gen_findings_index.py --check
          python3 tools_pc/gen_env_probes.py --check
          python3 tools_pc/gen_convert_data.py --check
          python3 tools_pc/gen_menudata.py --check

  # Host (Linux) build of the game core plus the CTest binaries (tests/): no
  # ROM, no window, no audio device. Runs in parallel with the NRO build.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Same pinned image as the nro job (devkitA64 image = Ubuntu with the host
    # toolchain available); the host libraries are installed as in Dockerfile.build.
    container: docker.io/devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 libsdl2-dev libgl1-mesa-dev \
            libvulkan-dev glslang-tools zlib1g-dev git
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build-linux -G Ninja -DROMID=ntsc-final
          cmake --build build-linux

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

  nro:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Same pinned image as Dockerfile.build: devkitA64, libnx and the Switch
    # portlibs (SDL2, mesa, zlib).
    container: docker.io/devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake git ninja-build python3 zip
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/project-dam-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/project-dam-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          cmake -S . -B build-switch -G Ninja -DROMID=ntsc-final \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DPROJECT_DAM_VERSION=${{ steps.version.outputs.version }} \
            -DGE007_UPDATE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build-switch

      - name: Package
        run: sh tools/switch/package_release.sh ${{ steps.version.outputs.version }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: project-dam-${{ steps.version.outputs.version }}-switch
          path: |
            dist/project-dam-${{ steps.version.outputs.version }}-switch.zip
            dist/project-dam.nro
          if-no-files-found: error

  # Windows x86-64 build, cross-compiled in the same image as
  # `docker compose build windows` (Dockerfile.windows: Fedora MinGW-w64).
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/project-dam-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/project-dam-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Image
        run: docker build -f Dockerfile.windows -t project-dam-build-windows .

      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e PROJECT_DAM_VERSION=${{ steps.version.outputs.version }} \
            -e CMAKE_BUILD_TYPE=Release \
            project-dam-build-windows sh tools_pc/docker-build-win.sh

      - name: Package
        run: sh tools/switch/package_release_win.sh ${{ steps.version.outputs.version }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: project-dam-${{ steps.version.outputs.version }}-windows-x64
          path: dist/project-dam-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/project-dam-v')
    needs: [ nro, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#project-dam-v}"
          {
            printf "## What's Changed\n\n"
            # This version's section of CHANGELOG.md, without its heading.
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[.*\]: / { exit }
              on { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md
          ls -l dist
          gh release create "$tag" dist/*.zip dist/project-dam.nro \
            --title "Project Dam v$version" --notes-file notes.md --latest
