name: Switch

# Project Dam: builds the Nintendo Switch NRO and the Windows zip on every push
# and pull request,
# and publishes a GitHub release for a project-dam-vX.Y.Z tag, with the notes
# taken from that version's section of CHANGELOG.md.
#
# (ci.yml and selfhosted.yml are upstream's desktop workflows; their release
# job only reacts to upstream's own vX.Y.Z tags.)

on:
  push:
    branches: [ main ]
    tags: [ 'project-dam-v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host (Linux) build of the game core plus the CTest binaries (tests/): no
  # ROM, no window, no audio device. Runs in parallel with the NRO build.
  tests:
    runs-on: ubuntu-24.04
    # Same pinned image as the nro job (devkitA64 image = Ubuntu with the host
    # toolchain available); the host libraries are installed as in Dockerfile.build.
    container: docker.io/devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 libsdl2-dev libgl1-mesa-dev \
            libvulkan-dev glslang-tools zlib1g-dev git
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build-linux -G Ninja -DROMID=ntsc-final
          cmake --build build-linux

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

  nro:
    runs-on: ubuntu-24.04
    # Same pinned image as Dockerfile.build: devkitA64, libnx and the Switch
    # portlibs (SDL2, mesa, zlib).
    container: docker.io/devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake git ninja-build python3 zip
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/project-dam-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/project-dam-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          cmake -S . -B build-switch -G Ninja -DROMID=ntsc-final \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DPROJECT_DAM_VERSION=${{ steps.version.outputs.version }} \
            -DGE007_UPDATE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build-switch

      - name: Package
        run: sh tools/switch/package_release.sh ${{ steps.version.outputs.version }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: project-dam-${{ steps.version.outputs.version }}
          path: |
            dist/project-dam-${{ steps.version.outputs.version }}.zip
            dist/project-dam.nro
          if-no-files-found: error

  # Windows x86-64 build, cross-compiled in the same image as
  # `docker compose build windows` (Dockerfile.windows: Fedora MinGW-w64).
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/project-dam-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/project-dam-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Image
        run: docker build -f Dockerfile.windows -t project-dam-build-windows .

      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e PROJECT_DAM_VERSION=${{ steps.version.outputs.version }} \
            -e CMAKE_BUILD_TYPE=Release \
            project-dam-build-windows sh tools_pc/docker-build-win.sh

      - name: Package
        run: sh tools/switch/package_release_win.sh ${{ steps.version.outputs.version }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: project-dam-${{ steps.version.outputs.version }}-windows-x64
          path: dist/project-dam-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/project-dam-v')
    needs: [ nro, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#project-dam-v}"
          {
            printf "## What's Changed\n\n"
            # This version's section of CHANGELOG.md, without its heading.
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[.*\]: / { exit }
              on { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md
          ls -l dist
          gh release create "$tag" dist/*.zip dist/project-dam.nro \
            --title "Project Dam v$version" --notes-file notes.md --latest
